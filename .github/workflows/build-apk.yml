name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NeonRaspisanie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeonRaspisanie-apk
          path: NeonRaspisanie.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Neon Расписание (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            APK собран автоматически из ветки `${{ github.ref_name }}` (${{ github.sha }}).
            Скачайте NeonRaspisanie.apk на телефон и установите (разрешите установку из неизвестных источников).
          files: NeonRaspisanie.apk
          make_latest: true
