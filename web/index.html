/* ======================= Отрисовка ======================= */
let nextBoundary = Infinity, lastDay = todayEd(), shown = {};
function clockText() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map((x) => String(x).padStart(2, '0')).join(':'); }
function render() {
  applyTheme();
  const app = document.getElementById('app'), nav = document.getElementById('nav'), layer = document.getElementById('layer');
  const now = Date.now();
  lastDay = todayEd();
  const ready = S.schedule && S.group && S.schedule.groups.includes(S.group) && !needsStream();
  if (!ready) { app.innerHTML = onboarding(); nav.innerHTML = ''; layer.innerHTML = ''; shown = {}; return; }
  // Анимация появления — только при открытии окна, а прокрутка сохраняется между перерисовками
  // (иначе экран настроек и шторка «дёргаются» при каждом нажатии).
  const keep = { ov: layer.querySelector('.overlay')?.scrollTop || 0, sh: layer.querySelector('.sheet, .dialog')?.scrollTop || 0 };
  const sig = S.modal ? S.modal.type + '|' + (S.modal.key || '') + '|' + (S.modal.subject || '') : '';
  const enterOverlay = S.settings && !shown.settings, enterModal = sig && sig !== shown.modal;
  if (S.settings) {
    app.innerHTML = '';
    nav.innerHTML = '';
    layer.innerHTML = `<div class="overlay ${enterOverlay ? 'enter' : ''}"><div class="inner">${screenSettings()}</div></div>` + modalHtml(now);
  } else {
    const scr = { today: screenToday, week: screenWeek, hw: screenHw, group: screenGroup }[S.tab](now);
    app.innerHTML = scr;
    const pending = groupHw().filter((h) => !h.done && h.dueDate >= todayEd()).length;
    const tabs = [['today', 'Сегодня', 'home'], ['week', 'Неделя', 'date'], ['hw', 'ДЗ', 'edit'], ['group', 'Моя группа', 'person']];
    nav.innerHTML = `<div class="pill">${tabs.map(([id, t, ic]) => `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}"><div class="ic">${icon(ic)}</div><span>${tr(t)}</span>${id === 'hw' && pending ? `<b class="badge">${pending > 9 ? '9+' : pending}</b>` : ''}</button>`).join('')}</div>`;
    layer.innerHTML = (S.tab === 'hw' ? `<button class="fab" data-act="addhw" aria-label="${tr('Добавить ДЗ')}">${icon('add', 'width:26px;height:26px')}</button>` : '') + modalHtml(now);
  }
  const ov = layer.querySelector('.overlay'), scrim = layer.querySelector('.scrim'), box = layer.querySelector('.sheet, .dialog');
  if (ov && !enterOverlay) ov.scrollTop = keep.ov;
  if (scrim && enterModal) scrim.classList.add('enter');
  if (box && !enterModal) box.scrollTop = keep.sh;
  shown = { settings: S.settings, modal: S.modal ? sig : '' };
  // Ближайшая граница пары — тогда перерисуем экран.
  nextBoundary = Infinity;
  for (const l of S.lessons) { const s = startMs(l), e = endMs(l); if (s > now) nextBoundary = Math.min(nextBoundary, s); if (e > now) nextBoundary = Math.min(nextBoundary, e); if (s > now + 86400e3) break; }
  tick();
}
function tick() {
  const now = Date.now();
  if (now >= nextBoundary || todayEd() !== lastDay) { render(); return; }
  document.querySelectorAll('[data-clock]').forEach((el) => { el.textContent = clockText(); });
  document.querySelectorAll('[data-cd]').forEach((el) => { const left = +el.dataset.cd - now; el.textContent = el.dataset.long && left >= 86400e3 ? humanize(left) : timer(left); });
  document.querySelectorAll('[data-from]').forEach((el) => { const a = +el.dataset.from, b = +el.dataset.to; el.firstElementChild.style.width = Math.max(0, Math.min(100, ((now - a) / (b - a)) * 100)) + '%'; });
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ======================= Данные: ДЗ и правки ======================= */
function saveHw() { LS.set('hw', S.hw); scheduleNotifications(); }
function addHomework(target, text) {
  S.hw.push({ id: Date.now(), group: S.group, lessonKey: lessonKey(target), subject: target.subject, dueDate: target.date, dueStart: startOf(target), text: text.trim(), done: false, createdAt: Date.now() });
  saveHw();
}
function saveEdits() { LS.set('edits', S.edits); refreshLessons(); }
function upsert(list, target, newLesson, id) {
  const ex = target.editId ? list.find((e) => e.id === target.editId) : null;
  if (ex) {
    if (!newLesson && !ex.origKey) return list.filter((e) => e !== ex);
    return list.map((e) => (e === ex ? Object.assign({}, e, { lesson: newLesson }) : e));
  }
  return list.concat({ id, group: S.group, origKey: lessonKey(target), lesson: newLesson });
}
function moveHomework(oldKey, l) {
  const nk = lessonKey(l);
  if (oldKey === nk) return;
  S.hw = S.hw.map((h) => (h.group === S.group && h.lessonKey === oldKey ? Object.assign({}, h, { lessonKey: nk, subject: l.subject, dueDate: l.date, dueStart: startOf(l) }) : h));
  saveHw();
}
function saveLessonForm() {
  const f = S.modal.form, orig = S.modal.key ? findLesson(S.modal.key) : null;
  const slots = orig && startOf(orig) === f.start && endOf(orig) === f.end ? orig.slots : [[f.start, f.end]];
  const base = { slots, subject: f.subject.trim(), fullSubject: orig && orig.subject === f.subject.trim() ? orig.fullSubject : f.subject.trim(), kind: f.kind, groups: [S.group],
    location: f.location.trim() || null, details: f.note.trim(), online: false, specialTime: false, elective: orig && orig.subject === f.subject.trim() ? orig.elective : null, stream: null, editId: null };
  let list = S.edits, id = Date.now();
  if (!orig) {
    const last = f.repeat ? f.until : f.date;
    for (let d = f.date; d <= last; d += 7) list = list.concat({ id: id++, group: S.group, origKey: null, lesson: Object.assign({}, base, { date: d }) });
  } else {
    const targets = f.applyAll ? similarLessons(orig) : [orig];
    for (const t of targets) {
      const nl = Object.assign({}, base, { date: lessonKey(t) === lessonKey(orig) ? f.date : t.date });
      list = upsert(list, t, nl, id++);
      moveHomework(lessonKey(t), nl);
    }
  }
  S.edits = list; saveEdits();
  toast(orig ? tr('Изменения сохранены') : tr('Занятие добавлено'));
}

/* ======================= Уведомления (пока страница открыта) ======================= */
let notifTimer = null;
function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: document.querySelector('link[rel=apple-touch-icon]').href, tag: title }); } catch (e) {
    navigator.serviceWorker && navigator.serviceWorker.ready.then((r) => r.showNotification(title, { body }));
  }
}
function scheduleNotifications() {
  clearTimeout(notifTimer);
  if (!S.group || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now(), n = S.notif, events = [];
  const horizon = now + 2 * 86400e3;
  if (n.before) for (const l of S.lessons) { const at = startMs(l) - n.lead * 60e3; if (at > now && at < horizon) events.push({ at, kind: 'lesson', l }); }
  const t = todayEd();
  for (let d = t; d <= t + 1; d++) {
    const at = msAt(d, n.eveningAt);
    if (at <= now) continue;
    if (n.evening && lessonsOn(d + 1).length) events.push({ at, kind: 'evening', day: d + 1 });
    if (n.homework && groupHw().some((h) => !h.done && h.dueDate === d + 1)) events.push({ at, kind: 'hw', day: d + 1 });
  }
  events.sort((a, b) => a.at - b.at);
  const ev = events[0];
  if (!ev) return;
  notifTimer = setTimeout(() => {
    for (const e of events.filter((x) => x.at === ev.at)) {
      if (e.kind === 'lesson') {
        const mins = Math.max(0, Math.round((startMs(e.l) - Date.now()) / 60e3));
        const hw = hwFor(e.l).filter((x) => !x.done).map((x) => '📝 ' + tr('ДЗ: {0}', x.text));
        notify(mins ? tr('Через {0} мин: {1}', mins, e.l.subject) : tr('Начинается: {0}', e.l.subject), [`${timeText(e.l)} · ${tr(KINDS[e.l.kind].title)}`, e.l.location ? '📍 ' + e.l.location : '', ...hw].filter(Boolean).join('\n'));
      } else if (e.kind === 'evening') {
        const ls = lessonsOn(e.day);
        notify(tr('Завтра: {0}, первая в {1}', `${ls.length} ${plural(ls.length, 'пара', 'пары', 'пар')}`, fmtMin(startOf(ls[0]))), ls.map((l) => `${fmtMin(startOf(l))}  ${l.subject}`).join('\n'));
      } else {
        const items = groupHw().filter((h) => !h.done && h.dueDate === e.day);
        notify(tr('ДЗ на завтра: {0}', items.length), items.map((h) => `• ${h.subject}: ${h.text}`).join('\n'));
      }
    }
    setTimeout(scheduleNotifications, 1000);
  }, Math.min(ev.at - now, 2147483000));
}

/* ======================= Загрузка файла ======================= */
async function loadFromBuffer(buf, save) {
  S.loading = true; S.error = null; render();
  try {
    const sch = await parseSchedule(buf);
    if (!sch.lessons.length) throw new Error(tr('В файле не найдено ни одного занятия'));
    S.schedule = sch;
    if (save) { LS.set('file', b64.enc(buf)); toast(tr('Расписание загружено: {0} занятий', sch.lessons.length)); }
    if (S.group && !sch.groups.includes(S.group)) S.group = null;
    refreshLessons();
  } catch (e) {
    S.error = tr('Не удалось прочитать файл: {0}', e && e.message ? e.message : e);
    if (save) toast(S.error);
  }
  S.loading = false; render();
}
document.getElementById('file').addEventListener('change', async (ev) => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (f) await loadFromBuffer(await f.arrayBuffer(), true);
});

/* ======================= События ======================= */
document.addEventListener('click', (ev) => {
  const stop = ev.target.closest('[data-stop]');
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (stop && !stop.contains(el)) return;
  if (stop && el.classList.contains('scrim')) return; // клик внутри окна
  const a = el.dataset.act, v = el.dataset.v, m = S.modal;
  const keepText = () => { const t = document.getElementById('hwText'); if (t && m) m.text = t.value; };
  switch (a) {
    case 'tab': S.tab = el.dataset.tab; S.modal = null; window.scrollTo(0, 0); break;
    case 'settings': S.settings = true; window.scrollTo(0, 0); break;
    case 'closeSettings': S.settings = false; break;
    case 'stab': S.settingsTab = +v; break;
    case 'lang': S.modal = { type: 'lang' }; break;
    case 'setLang': LANG = v; LS.set('lang', v); applyLang(); S.modal = null; scheduleNotifications(); break;
    case 'import': document.getElementById('file').click(); return;
    case 'removeSchedule': if (!confirm(tr('Удалить расписание? ДЗ и настройки сохранятся.'))) return; LS.del('file'); S.schedule = null; S.settings = false; refreshLessons(); break;
    case 'pickGroup': S.group = v; LS.set('group', v); refreshLessons(); break;
    case 'pickStream': S.stream = +v; LS.set('stream', +v); refreshLessons(); break;
    case 'mode': S.mode = v; LS.set('mode', v); break;
    case 'theme': S.theme = v; LS.set('theme', v); break;
    case 'elective': S.electives = S.electives.includes(v) ? S.electives.filter((x) => x !== v) : S.electives.concat(v); LS.set('electives', S.electives); refreshLessons(); break;
    case 'clearElectives': S.electives = []; LS.set('electives', []); refreshLessons(); break;
    case 'resetEdits': S.edits = S.edits.filter((e) => e.group !== S.group); saveEdits(); toast(tr('Ручные правки сброшены')); break;
    case 'week': S.weekSel += +el.dataset.d; break;
    case 'day': S.weekSel = +el.dataset.d; break;
    case 'open': S.modal = { type: 'lesson', key: el.dataset.key }; break;
    case 'close': S.modal = null; break;
    case 'hwTarget': keepText(); m.toNext = v === '1'; break;
    case 'saveHw': {
      const text = document.getElementById('hwText').value; if (!text.trim()) { toast(tr('Введите текст задания')); return; }
      const l = findLesson(m.key), next = nextOccurrence(l), target = m.toNext && next ? next : l;
      addHomework(target, text); m.text = ''; toast(tr('ДЗ добавлено на {0}', `${wdShort(target.date)}, ${dayMonth(target.date)}`)); break;
    }
    case 'hwToggle': S.hw = S.hw.map((h) => (h.id === +el.dataset.id ? Object.assign({}, h, { done: !h.done }) : h)); saveHw(); break;
    case 'hwDelete': S.hw = S.hw.filter((h) => h.id !== +el.dataset.id); saveHw(); break;
    case 'hwOpen': { const h = S.hw.find((x) => x.id === +el.dataset.id); if (h && findLesson(h.lessonKey)) S.modal = { type: 'lesson', key: h.lessonKey }; else return; break; }
    case 'addhw': S.modal = { type: 'addhw' }; break;
    case 'addhwSubject': m.subject = v; break;
    case 'addhwBack': m.subject = null; break;
    case 'addhwSave': { const text = document.getElementById('hwText2').value; const t = nextBySubject(m.subject); if (!text.trim() || !t) return; addHomework(t, text); S.modal = null; toast(tr('ДЗ добавлено на {0}', `${wdShort(t.date)}, ${dayMonth(t.date)}`)); break; }
    case 'editLesson': { const l = findLesson(m.key); S.modal = { type: 'editor', key: m.key, form: { subject: l.subject, kind: l.kind, date: l.date, start: startOf(l), end: endOf(l), location: l.location || '', note: l.editId ? l.details : '', applyAll: false, repeat: false, until: l.date } }; break; }
    case 'addLesson': { const last = S.lessons.length ? S.lessons[S.lessons.length - 1].date : S.weekSel + 90; S.modal = { type: 'editor', key: null, form: { subject: '', kind: 'PRACTICE', date: S.weekSel, start: 480, end: 570, location: '', note: '', applyAll: false, repeat: false, until: Math.max(last, S.weekSel) } }; break; }
    case 'fSubjectPick': m.form.subject = v; break;
    case 'fKind': m.form.kind = v; break;
    case 'fRepeat': m.form.repeat = !m.form.repeat; break;
    case 'fApplyAll': m.form.applyAll = !m.form.applyAll; break;
    case 'saveLesson': if (el.disabled) return; saveLessonForm(); S.modal = null; break;
    case 'askDelete': S.modal = { type: 'confirmDelete', key: m.key }; break;
    case 'doDelete': {
      const l = findLesson(m.key), targets = v === '1' ? similarLessons(l) : [l];
      let list = S.edits, id = Date.now();
      for (const t of targets) list = upsert(list, t, null, id++);
      S.edits = list; S.modal = null; saveEdits(); toast(targets.length > 1 ? tr('Удалено занятий: {0}', targets.length) : tr('Занятие удалено')); break;
    }
    case 'askNotif': Notification.requestPermission().then(() => { scheduleNotifications(); render(); }); return;
    case 'testNotif':
      if (!('Notification' in window)) { toast(tr('Браузер не поддерживает уведомления')); return; }
      if (Notification.permission !== 'granted') { Notification.requestPermission().then((p) => { if (p === 'granted') notify(tr('Уведомления работают ✨'), tr('Так будет выглядеть напоминание перед парой')); render(); }); return; }
      notify(tr('Уведомления работают ✨'), tr('Так будет выглядеть напоминание перед парой')); return;
    case 'nBefore': S.notif.before = !S.notif.before; break;
    case 'nEvening': S.notif.evening = !S.notif.evening; break;
    case 'nHw': S.notif.homework = !S.notif.homework; break;
    case 'nLead': S.notif.lead = +v; break;
    default: return;
  }
  if (a.startsWith('n')) { LS.set('notif', S.notif); scheduleNotifications(); }
  render();
});
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-change]'); if (!el) return;
  const k = el.dataset.change, f = S.modal && S.modal.form;
  const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const toEd = (s) => { const [y, m, d] = s.split('-').map(Number); return ed(y, m, d); };
  if (k === 'nEveningAt' && el.value) { S.notif.eveningAt = toMin(el.value); LS.set('notif', S.notif); scheduleNotifications(); return; }
  if (!f) return;
  if (k === 'fDate' && el.value) f.date = toEd(el.value);
  if (k === 'fUntil' && el.value) f.until = toEd(el.value);
  if (k === 'fStart' && el.value) { const len = f.end - f.start; f.start = toMin(el.value); if (f.end <= f.start) f.end = Math.min(f.start + Math.max(len, 45), 1439); }
  if (k === 'fEnd' && el.value) f.end = toMin(el.value);
  render();
});
document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-change]'); if (!el || !S.modal || !S.modal.form) return;
  const f = S.modal.form, k = el.dataset.change;
  if (k === 'fSubject') { f.subject = el.value; const b = document.querySelector('[data-act=saveLesson]'); if (b) b.disabled = !f.subject.trim() || f.end <= f.start; }
  if (k === 'fLoc') f.location = el.value;
  if (k === 'fNote') f.note = el.value;
});
// Шторку можно смахнуть вниз, как в приложении.
let drag = null;
document.addEventListener('touchstart', (ev) => {
  const sh = ev.target.closest('.sheet');
  if (!sh || ev.touches.length !== 1) { drag = null; return; }
  // Тянем за «ручку» или когда содержимое прокручено до верха (не из поля ввода).
  const fromGrab = !!ev.target.closest('.grab');
  if (!fromGrab && (sh.scrollTop > 0 || ev.target.closest('textarea, input, .hscroll'))) { drag = null; return; }
  drag = { sh, y0: ev.touches[0].clientY, t0: Date.now(), dy: 0, active: false };
}, { passive: true });
document.addEventListener('touchmove', (ev) => {
  if (!drag) return;
  const dy = ev.touches[0].clientY - drag.y0;
  if (!drag.active) {
    if (dy < 6) { if (dy < -6) drag = null; return; }
    drag.active = true; drag.sh.style.transition = 'none';
  }
  drag.dy = Math.max(0, dy);
  drag.sh.style.transform = `translateY(${drag.dy}px)`;
  const scrim = drag.sh.parentElement; if (scrim) scrim.style.background = `rgba(0,0,0,${0.55 * Math.max(0.2, 1 - drag.dy / (drag.sh.offsetHeight || 1))})`;
  ev.preventDefault();
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.active) return;
  const fast = d.dy / Math.max(1, Date.now() - d.t0) > 0.6;
  d.sh.style.transition = 'transform .2s ease-out';
  if (d.dy > Math.min(140, d.sh.offsetHeight * 0.3) || (fast && d.dy > 40)) {
    d.sh.style.transform = 'translateY(105%)';
    if (d.sh.parentElement) { d.sh.parentElement.style.transition = 'background .2s'; d.sh.parentElement.style.background = 'rgba(0,0,0,0)'; }
    setTimeout(() => { S.modal = null; render(); }, 190);
  } else {
    d.sh.style.transform = '';
    if (d.sh.parentElement) d.sh.parentElement.style.background = '';
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { if (S.modal) S.modal = null; else if (S.settings) S.settings = false; else return; render(); } });
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.mode === 'SYSTEM' && render());
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ======================= Старт ======================= */
(async () => {
  applyLang();
  applyTheme();
  const saved = LS.get('file', null);
  if (saved) await loadFromBuffer(b64.dec(saved), false); else render();
  setInterval(tick, 1000);
})();
</script>
