<style>
:root{
  --bg:#07070c;--surface:#101017;--surface-hi:#181822;--stroke:#2a2a36;
  --primary:#00e5ff;--secondary:#ff2e97;--tertiary:#b98cff;--success:#3ddc97;--warning:#ffc14d;
  --text:#f5f5fa;--muted:#b4b4d0;--dim:#8a8aa6;--on-accent:#0a0a10;--glow:85%;--blob:24%;
  --r:22px;--maxw:560px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text)}
.tnum{font-variant-numeric:tabular-nums}
/* ---------- фон с неоновыми пятнами ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
#bg i{position:absolute;border-radius:50%;filter:blur(10px);opacity:1}
#bg i:nth-child(1){width:110vmax;height:110vmax;left:-45vmax;top:-60vmax;background:radial-gradient(circle,color-mix(in srgb,var(--tertiary) var(--blob),transparent) 0%,transparent 60%);animation:drift1 28s ease-in-out infinite alternate}
#bg i:nth-child(2){width:100vmax;height:100vmax;right:-55vmax;top:10vh;background:radial-gradient(circle,color-mix(in srgb,var(--primary) calc(var(--blob) * .75),transparent) 0%,transparent 60%);animation:drift2 32s ease-in-out infinite alternate}
#bg i:nth-child(3){width:90vmax;height:90vmax;left:-35vmax;bottom:-55vmax;background:radial-gradient(circle,color-mix(in srgb,var(--secondary) calc(var(--blob) * .62),transparent) 0%,transparent 60%);animation:drift1 36s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(18vw,6vh)}}
@keyframes drift2{to{transform:translate(-22vw,-5vh)}}
#app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 120px)}
/* ---------- карточки ---------- */
.card{--a:var(--primary);position:relative;border-radius:var(--r);padding:16px;border:1px solid transparent;
  background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,
             linear-gradient(135deg,color-mix(in srgb,var(--a) 45%,transparent),var(--stroke) 55%,var(--stroke)) border-box;margin-bottom:10px}
.card.glow{border-width:1.5px;background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,linear-gradient(135deg,var(--a),var(--secondary)) border-box;
  box-shadow:0 0 26px color-mix(in srgb,var(--a) 45%,transparent)}
.light .card:not(.glow){box-shadow:0 2px 10px color-mix(in srgb,var(--a) 14%,transparent)}
.card.click{cursor:pointer}
.card.click:active{transform:scale(.995)}
.chip{--a:var(--primary);display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;
  color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);border:1px solid color-mix(in srgb,var(--a) 70%,transparent);white-space:nowrap}
.chip.fill{background:var(--a);color:var(--on-accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.section{margin:22px 4px 8px;font-size:12px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.glowtxt{text-shadow:0 0 18px color-mix(in srgb,var(--a,var(--primary)) var(--glow),transparent)}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.progress{height:8px;border-radius:99px;background:var(--stroke);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a,var(--primary)),var(--secondary));box-shadow:0 0 8px var(--a,var(--primary))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:16px;font-weight:700;
  background:var(--primary);color:var(--on-accent)}
.btn.grad{background:linear-gradient(90deg,var(--primary),var(--tertiary),var(--secondary))}
.btn.out{background:transparent;border:1px solid color-mix(in srgb,var(--a,var(--primary)) 70%,transparent);color:var(--a,var(--primary))}
.btn:disabled{opacity:.45}
.todaybtn{margin:14px 0 2px;height:50px;font-size:16px;font-weight:800;box-shadow:0 0 18px color-mix(in srgb,var(--primary) 45%,transparent),0 4px 20px color-mix(in srgb,var(--tertiary) 35%,transparent)}
.topbtns{display:flex;justify-content:space-between;align-items:center}
.langbtn{font-weight:800;font-size:13px;letter-spacing:.5px;color:var(--tertiary)}
.langrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;margin-bottom:8px;border-radius:16px;border:1px solid var(--stroke);background:var(--surface-hi);font-size:16px;text-align:start}
.langrow b{font-size:12px;color:var(--muted)}
.langrow.on{background:linear-gradient(90deg,var(--primary),var(--tertiary));color:var(--on-accent);border-color:transparent;font-weight:800}
.langrow.on b{color:var(--on-accent)}
html[dir=rtl] svg.i.mir{transform:scaleX(-1)}
html[dir=rtl] .loc span,html[dir=rtl] .subj,html[dir=rtl] .hero-title{unicode-bidi:plaintext}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--primary);
  background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,linear-gradient(135deg,var(--primary),var(--tertiary)) border-box;border:1px solid transparent;
  box-shadow:0 0 14px color-mix(in srgb,var(--primary) 40%,transparent)}
svg.i{width:22px;height:22px;fill:currentColor}
/* ---------- карточка пары ---------- */
.lesson{display:flex;gap:0}
.lesson .time{width:62px;flex:none}
.lesson .t1{font-size:20px;font-weight:800;color:var(--a)}
.lesson .t2{font-size:14px;color:var(--muted)}
.lesson .bar{width:3px;border-radius:9px;background:var(--a);margin:0 10px;flex:none}
.lesson .body{flex:1;min-width:0}
.lesson .subj{font-size:16px;font-weight:650;margin-top:6px;line-height:1.25}
.lesson .loc{display:flex;gap:4px;align-items:flex-start;margin-top:4px;font-size:12px;color:var(--muted)}
.lesson .loc svg{width:14px;height:14px;flex:none;margin-top:1px}
.lesson.past{opacity:.5}
.small-status{margin-top:6px;font-size:13px;font-weight:700;color:var(--a)}
/* ---------- часы ---------- */
.clock{font-size:clamp(46px,14vw,60px);font-weight:300;letter-spacing:2px;color:var(--primary);text-align:center;--a:var(--primary)}
.datebig{text-align:center;font-size:18px;font-weight:500}
.center-chips{display:flex;justify-content:center;gap:8px;margin-top:8px}
.big-timer{font-size:34px;font-weight:800}
.label{font-size:12px;letter-spacing:2px;font-weight:800;text-transform:uppercase}
/* ---------- нижняя панель ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
#nav .pill{pointer-events:auto;max-width:calc(var(--maxw) - 4px);margin:0 auto;display:flex;padding:8px 6px;border-radius:28px;border:1px solid transparent;
  background:linear-gradient(180deg,var(--surface-hi),var(--surface)) padding-box,linear-gradient(90deg,color-mix(in srgb,var(--primary) 55%,transparent),color-mix(in srgb,var(--tertiary) 35%,transparent),color-mix(in srgb,var(--secondary) 55%,transparent)) border-box;
  box-shadow:0 8px 30px color-mix(in srgb,var(--primary) 25%,transparent)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500;position:relative}
#nav button .ic{width:52px;height:32px;border-radius:16px;display:grid;place-items:center;border:1px solid transparent;transition:.2s}
#nav button.on{color:var(--primary);font-weight:800}
#nav button.on .ic{background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 28%,transparent),color-mix(in srgb,var(--tertiary) 22%,transparent));border-color:color-mix(in srgb,var(--primary) 60%,transparent)}
#nav button.on span{text-shadow:0 0 10px color-mix(in srgb,var(--primary) var(--glow),transparent)}
#nav .badge{position:absolute;top:-4px;left:calc(50% + 12px);min-width:18px;height:18px;border-radius:9px;background:var(--secondary);color:var(--on-accent);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - var(--maxw)/2 + 16px));bottom:calc(env(safe-area-inset-bottom) + 104px);width:58px;height:58px;border-radius:18px;background:var(--secondary);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 22px color-mix(in srgb,var(--secondary) 45%,transparent)}
/* ---------- неделя ---------- */
.weekhead{display:flex;align-items:center;gap:6px}
.weekhead .mid{flex:1;text-align:center}
.days{display:flex;gap:6px;margin-top:6px}
.day{flex:1;border-radius:16px;padding:10px 0;text-align:center;background:var(--surface-hi);border:1px solid transparent}
.day .w{font-size:12px;font-weight:600;color:var(--muted)} .day .n{font-size:18px;font-weight:800}
.day .dots{display:flex;gap:2px;justify-content:center;height:4px;margin-top:4px}.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--secondary)}
.day.today{border-color:var(--secondary)}
.day.sel{background:var(--primary);box-shadow:0 0 14px var(--primary)}.day.sel .w,.day.sel .n{color:var(--on-accent)}.day.sel .dots i{background:var(--on-accent)}
/* ---------- сетки выбора ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1.3;border-radius:18px;display:grid;place-items:center;font-size:20px;font-weight:800;background:var(--surface-hi);border:1px solid var(--stroke)}
.tile.sel{background:var(--primary);color:var(--on-accent);border-color:var(--primary);box-shadow:0 0 16px var(--primary)}
.seg{display:flex;padding:4px;border-radius:18px;background:var(--surface);border:1px solid var(--stroke)}
.seg button{flex:1;height:40px;border-radius:14px;color:var(--muted);font-weight:500;font-size:14px;border:1px solid transparent}
.seg button.on{color:var(--primary);font-weight:800;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 30%,transparent),color-mix(in srgb,var(--tertiary) 25%,transparent));border-color:color-mix(in srgb,var(--primary) 70%,transparent)}
.accent{border-radius:18px;padding:12px 0;text-align:center;border:1px solid;cursor:pointer}
.accent .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 6px}
.accent span{font-size:11px;font-weight:600}
/* ---------- переключатели, поля ---------- */
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.switch{width:52px;height:32px;border-radius:16px;background:var(--surface-hi);border:1px solid var(--stroke);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--primary);border-color:var(--primary)}.switch.on::after{left:26px;background:var(--on-accent);width:20px}
.field{width:100%;border-radius:14px;border:1px solid var(--stroke);background:var(--surface);padding:12px 14px;outline:none;color-scheme:dark}
.row .field{min-width:0}
html[dir=rtl] .field{unicode-bidi:plaintext}
.row input[type=time].field,.row input[type=date].field{padding:12px 8px}

.field:focus{border-color:var(--primary)}
textarea.field{min-height:70px;resize:vertical}
.lbl{font-size:12px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}

/* ---------- модальные окна ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}

.sheet{width:100%;max-width:var(--maxw);max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);border-top:1px solid var(--stroke);overscroll-behavior:contain;will-change:transform}

.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.6;margin:0 auto 14px;box-sizing:content-box;padding:8px 40px;background-clip:content-box;margin-top:-6px;touch-action:none;cursor:grab}
.dialog-wrap{align-items:center;padding:16px}

@keyframes up{from{transform:translateY(40px);opacity:.4}}

.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;overscroll-behavior:contain}

.ohead{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--stroke)}
.info-l{font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;color:var(--dim);margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 104px);z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;max-width:90vw;animation:fade .2s}
h1.t{font-size:26px;margin:8px 4px 0;font-weight:800}
.hero-title{font-size:20px;font-weight:800;margin-top:4px;line-height:1.25}
a{color:var(--primary)}
</style>

<body>
<div id="bg"><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="nav"></div>
<div id="layer"></div>
<input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<script>
// @@PARSER-START
/* ======================= Даты (epoch day) ======================= */
const DAY_MS = 86400000;
const ed = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / DAY_MS);
const edValid = (y, m, d) => { const x = new Date(Date.UTC(y, m - 1, d)); return x.getUTCFullYear() === y && x.getUTCMonth() === m - 1 && x.getUTCDate() === d; };
const edParts = (e) => { const x = new Date(e * DAY_MS); return [x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()]; };
const dow = (e) => { const w = new Date(e * DAY_MS).getUTCDay(); return w === 0 ? 7 : w; }; // Пн=1 … Вс=7
const iso = (e) => { const [y, m, d] = edParts(e); return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; };
const mondayOf = (e) => e - (dow(e) - 1);
const todayEd = () => { const n = new Date(); return ed(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const fmtMin = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;

/* ======================= Чтение .xlsx ======================= */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Это не файл .xlsx');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  const dec = new TextDecoder();
  for (let i = 0; i < count; i++) {
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    const lnl = dv.getUint16(off + 26, true), lxl = dv.getUint16(off + 28, true);
    const data = u8.subarray(off + 30 + lnl + lxl, off + 30 + lnl + lxl + csize);
    files[name.replace(/^\//, '')] = { method, data };
  }
  const out = {};
  for (const [name, f] of Object.entries(files)) {
    if (!/\.(xml|rels)$/.test(name)) continue;
    const raw = f.method === 0 ? f.data : await inflateRaw(f.data);
    out[name] = new TextDecoder().decode(raw);
  }
  return out;
}

const xmlDecode = (s) => s
  .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
  .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

function textOfXml(x) {
  x = x.replace(/<(\w+:)?rPh\b[\s\S]*?<\/(\w+:)?rPh>/g, '');
  let s = '';
  for (const m of x.matchAll(/<(?:\w+:)?t(?:\s[^>]*)?>([\s\S]*?)<\/(?:\w+:)?t>/g)) s += xmlDecode(m[1]);
  return s;
}

function parseRef(ref) {
  const m = /^([A-Z]+)(\d+)$/.exec(ref.trim().toUpperCase());
  if (!m) return null;
  let col = 0;
  for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
  return { row: +m[2], col };
}

class Sheet {
  constructor(cells, merges) {
    this.cells = cells; // Map "r,c" -> text
    this.merges = merges;
    this.mergeMap = new Map();
    for (const mg of merges) for (let r = mg.r1; r <= mg.r2; r++) for (let c = mg.c1; c <= mg.c2; c++) this.mergeMap.set(r + ',' + c, mg);
    let mr = 0, mc = 0;
    for (const k of cells.keys()) { const [r, c] = k.split(',').map(Number); mr = Math.max(mr, r); mc = Math.max(mc, c); }
    this.maxRow = mr; this.maxCol = mc;
    this.ordered = [...cells.entries()].map(([k, v]) => { const [r, c] = k.split(',').map(Number); return { row: r, col: c, text: v }; })
      .sort((a, b) => a.row - b.row || a.col - b.col);
  }
  text(r, c) { return this.cells.get(r + ',' + c) || ''; }
  mergeOf(r, c) { return this.mergeMap.get(r + ',' + c) || null; }
  values() { return this.ordered.map((x) => x.text); }
}

async function readXlsx(buf) {
  const files = await unzip(buf);
  const shared = [];
  if (files['xl/sharedStrings.xml']) for (const m of files['xl/sharedStrings.xml'].matchAll(/<(?:\w+:)?si>([\s\S]*?)<\/(?:\w+:)?si>/g)) shared.push(textOfXml(m[1]));
  let sheetPath = null;
  try {
    const rid = /<(?:\w+:)?sheet\b[^>]*\br:id="([^"]+)"/.exec(files['xl/workbook.xml'])[1];
    const rel = [...files['xl/_rels/workbook.xml.rels'].matchAll(/<Relationship\b[^>]*>/g)].map((m) => m[0]).find((r) => r.includes(`Id="${rid}"`));
    const target = /Target="([^"]+)"/.exec(rel)[1];
    sheetPath = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
  } catch (e) { /* запасной путь ниже */ }
  if (!files[sheetPath]) sheetPath = Object.keys(files).filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if (!sheetPath) throw new Error('В файле не найден лист с расписанием');
  const xml = files[sheetPath];
  const cells = new Map();
  for (const m of xml.matchAll(/<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g)) {
    const attrs = m[1], inner = m[2] || '';
    const r = /\br="([A-Z]+\d+)"/.exec(attrs); if (!r) continue;
    const ref = parseRef(r[1]); if (!ref) continue;
    const t = (/\bt="([^"]+)"/.exec(attrs) || [])[1];
    const v = (/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/.exec(inner) || [])[1];
    let value = null;
    if (t === 's') value = v != null ? shared[+v] : null;
    else if (t === 'inlineStr') value = textOfXml(inner);
    else value = v != null ? xmlDecode(v) : null;
    if (value != null && value.trim() !== '') cells.set(ref.row + ',' + ref.col, value);
  }
  const merges = [];
  for (const m of xml.matchAll(/<(?:\w+:)?mergeCell\b[^>]*\bref="([^"]+)"/g)) {
    const [a, b] = m[1].split(':');
    const A = parseRef(a), B = parseRef(b || a);
    if (A && B) merges.push({ r1: A.row, c1: A.col, r2: B.row, c2: B.col });
  }
  return new Sheet(cells, merges);
}

/* ======================= Общие помощники ======================= */
const clean = (s) => String(s).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const isLetter = (ch) => /[A-Za-zА-Яа-яЁё]/.test(ch);
function sentence(s) {
  const letters = [...s].filter(isLetter);
  if (!letters.length) return s;
  const upper = letters.filter((c) => c !== c.toLowerCase()).length;
  if (upper < letters.length * 0.7) {
    const first = s.trim().split(' ')[0];
    if (first.length < 4 || [...first].some((c) => c !== c.toUpperCase())) return s;
    return cap(s.replace(/[А-ЯЁA-Z]{2,}/g, (w) => w.toLowerCase()));
  }
  return cap(s.toLowerCase()).replace(/([а-яё]{4,}[.!?]\s+)([а-яё])/g, (_, a, b) => a + b.toUpperCase());
}
function shortName(full) {
  const f = full.replace(/\s*\(пр\.?\s*занятия\)/gi, '').trim();
  if (/, клиническ/i.test(f)) return f.split(',')[0].trim();
  if (f.length > 60 && f.includes('(')) return f.split('(')[0].trim();
  return f;
}
const normKey = (s) => s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z ]/g, ' ').replace(/\s+/g, ' ').trim();
const lessonKey = (l) => `${l.subject}|${iso(l.date)}|${l.slots[0][0]}|${l.kind}` + (l.stream ? `|s${l.stream}` : '');

function disciplineFor(disciplines, subject) {
  const key = normKey(subject);
  const named = disciplines.map((d) => [d, normKey(d.name)]);
  const a = named.find(([, n]) => n.startsWith(key) || key.startsWith(n));
  if (a) return a[0];
  const b = named.find(([, n]) => n.length >= 7 && key.length >= 7 && n.slice(0, 7) === key.slice(0, 7));
  return b ? b[0] : null;
}

function weekType(sch, e) {
  if (sch.week1.some(([a, b]) => e >= a && e <= b)) return 1;
  if (sch.week2.some(([a, b]) => e >= a && e <= b)) return 2;
  const base = mondayOf(sch.week1.length ? sch.week1[0][0] : sch.semesterStart);
  const w = Math.floor((mondayOf(e) - base) / 7);
  return ((w % 2) + 2) % 2 === 0 ? 1 : 2;
}

/* ======================= Формат 1: недельное расписание ======================= */
const P = {
  TIME: String.raw`\d{1,2}[.:]\d{2}-\d{1,2}[.:]\d{2}`,
  TIME_RANGE: /(\d{1,2})[.:](\d{2})-(\d{1,2})[.:](\d{2})/g,
  TRIPLE: /(?<![\d.])(\d{1,2}\.\d{2})-(\d{1,2}\.\d{2})-(\d{1,2}\.\d{2})(?!\d)/g,
  PAIR: /(?<![\d.])(\d{1,2}\.\d{2})\s*-\s*(\d{1,2}\.\d{2})(?!\d)/g,
  UNTIL: /(?<![А-Яа-яЁё])по\s+(\d{1,2}\.\d{2})(?!\d)/gi,
  SINGLE: /(?<![\d.])(\d{1,2}\.\d{2})(?!\d)/g,
  ONLINE: /(\d{1,2}\.\d{2})\s*-\s*онлайн/gi,
  PARITY: /(?<!\d)([12])\s*недел[яи]/i,
  GROUP: /группа\s*(\d+)/i,
  ROOM: /(\d+)\s*корпус,?\s*аудитори[яи]\s*(\d+)/i,
  SHORT_ROOM: /(?<![\d.]|ссылка |ссылка\s)(\d)-(\d{3})(?!\d)/,
  OPTION_NAME: /(?<![А-Яа-яЁё.])[А-ЯЁ][а-яё]+(?:\s+[а-яё]+|\s*,\s*[а-яё]+)*/g,
  OPTION_TAIL: /(\s+на\s+кафедре.*|,?\s*гр(?![а-яё]).*)$/,
  STREET: /ул\.\s*[А-ЯЁ][а-яё]+,?\s*\d+[а-я]?/,
};
P.HEADER = new RegExp(String.raw`(?<!\S)(${P.TIME}(?:\s*,\s*${P.TIME})*)\s+(?=[А-ЯЁA-Z])`, 'g');
const DAY_CODES = { 'ПН': 1, 'ВТ': 2, 'СР': 3, 'ЧТ': 4, 'ПТ': 5, 'СБ': 6, 'ВС': 7 };
const MONTH_KEYS = [['январ', 1], ['феврал', 2], ['март', 3], ['апрел', 4], ['ма', 5], ['июн', 6], ['июл', 7], ['август', 8], ['сентябр', 9], ['октябр', 10], ['ноябр', 11], ['декабр', 12]];

function slot(h1, m1, h2, m2) {
  if (h1 < 6 || h1 > 22 || h2 < 6 || h2 > 23 || m1 > 59 || m2 > 59) return null;
  const s = h1 * 60 + m1, e = h2 * 60 + m2;
  return e > s ? [s, e] : null;
}
const timeSlot = (a, b) => { const [h1, m1] = a.split('.').map(Number); const [h2, m2] = b.split('.').map(Number); return slot(h1, m1, h2, m2); };
const isDateLike = (s) => { const [d, m] = s.split('.').map(Number); return d >= 1 && d <= 31 && ((m >= 8 && m <= 12) || (m >= 1 && m <= 2)); };
const re = (r) => new RegExp(r.source, r.flags); // свежая копия (без lastIndex)

function locationOf(text) {
  const m = re(P.ROOM).exec(text);
  if (m) { const st = re(P.STREET).exec(text); return `${m[1]} корпус, ауд. ${m[2]}` + (st ? `, ${st[0]}` : ''); }
  const s = re(P.SHORT_ROOM).exec(text);
  return s ? `${s[1]} корпус, ауд. ${s[2]}` : null;
}

function parseWeekly(sheet, today) {
  const all = sheet.values().map(clean).join('\n');
  const yearM = /(\d{4})\s*-\s*(\d{4})\s*учебн/.exec(all);
  const [ty, tm] = edParts(today);
  const startYear = yearM ? +yearM[1] : (tm >= 8 ? ty : ty - 1);
  let semesterStart = ed(startYear, 9, 1);
  const sm = /начало\s+семестра\s+(\d{1,2})\s+([а-яё]+)\s+(\d{4})/i.exec(all);
  if (sm) {
    const mk = MONTH_KEYS.find(([k]) => sm[2].toLowerCase().startsWith(k));
    if (mk && edValid(+sm[3], mk[1], +sm[1])) semesterStart = ed(+sm[3], mk[1], +sm[1]);
  }
  const toDate = (s) => {
    const [d, m] = s.split('.').map(Number);
    if (m < 1 || m > 12 || d < 1 || d > 31) return null;
    const y = m >= 8 ? startYear : startYear + 1;
    return edValid(y, m, d) ? ed(y, m, d) : null;
  };

  // Столбцы групп
  let headerRow = -1;
  const groupCols = new Map();
  for (const c of sheet.ordered) {
    const m = P.GROUP.exec(c.text);
    if (!m || c.text.trim().length > 20) continue;
    if (headerRow === -1 || c.row === headerRow) { headerRow = c.row; groupCols.set(c.col, m[1]); }
  }
  if (!groupCols.size) throw new Error('Не найдены столбцы «группа …»');
  const gcols = [...groupCols.keys()].sort((a, b) => a - b);

  // Чередование недель
  const week1 = [], week2 = [];
  const wtxt = sheet.values().map(clean).find((t) => /1\s*неделя\s*-/.test(t));
  if (wtxt) {
    const i2m = /2\s*неделя\s*-/.exec(wtxt);
    const i2 = i2m ? i2m.index : wtxt.length;
    const ranges = (s, out) => { for (const m of s.matchAll(re(P.PAIR))) { const a = toDate(m[1]), b = toDate(m[2]); if (a != null && b != null) out.push([a, b < a ? b + 365 : b]); } };
    ranges(wtxt.slice(0, i2), week1); ranges(wtxt.slice(i2), week2);
  }
  const weeks = { week1, week2, semesterStart };
  const lessons = [];
  let day = null;
  for (let row = headerRow + 1; row <= sheet.maxRow; row++) {
    const a = clean(sheet.text(row, 1)).toUpperCase();
    if (a.startsWith('ДИСЦИПЛИНА')) break;
    if (DAY_CODES[a.slice(0, 2)]) day = DAY_CODES[a.slice(0, 2)];
    if (!a) { const mr = sheet.mergeOf(row, 1); if (mr) { const d = DAY_CODES[clean(sheet.text(mr.r1, mr.c1)).toUpperCase().slice(0, 2)]; if (d) day = d; } }
    if (!day) continue;
    for (const col of gcols) {
      const merge = sheet.mergeOf(row, col);
      if (merge && (merge.r1 !== row || merge.c1 !== col)) continue;
      const raw = clean(sheet.text(row, col));
      if (!raw || /1\s*неделя\s*-/.test(raw)) continue;
      const groups = merge && merge.c2 > merge.c1 ? gcols.filter((c) => c >= merge.c1 && c <= merge.c2).map((c) => groupCols.get(c)) : [groupCols.get(col)];
      if (!groups.length) continue;
      lessons.push(...parseCell(raw, day, groups, semesterStart, weeks, toDate));
    }
  }
  const disciplines = parseDisciplines(sheet);
  const electives = [...new Set(lessons.map((l) => l.elective).filter(Boolean))];
  for (const l of lessons) {
    if (l.elective) continue;
    const key = normKey(l.subject);
    const opt = electives.find((e) => { const ek = normKey(e); return ek.length >= 15 && (key.startsWith(ek) || (ek.startsWith(key) && key.length >= 15)); });
    if (opt) { l.subject = opt; l.elective = opt; if (l.kind === 'PRACTICE') l.kind = 'ELECTIVE'; }
  }
  for (const l of lessons) {
    if (l.location) continue;
    const d = disciplineFor(disciplines, l.subject);
    if (d) { const b = /\(([^()]*(?:корпус|ул\.)[^()]*)\)/.exec(d.department); l.location = (b ? b[1] : d.department).trim(); }
  }
  const titleCell = sheet.values().map(clean).find((t) => t.toUpperCase().startsWith('РАСПИСАНИЕ'));
  const seen = new Set();
  return {
    title: titleCell ? sentence(titleCell) : 'Расписание',
    groups: gcols.map((c) => groupCols.get(c)),
    lessons: lessons.filter((l) => { const k = lessonKey(l) + l.groups.slice().sort().join(','); if (seen.has(k)) return false; seen.add(k); return true; }),
    semesterStart, week1, week2, disciplines, electives, hasWeekParity: true, streams: [],
  };
}

function parseCell(text, dw, groups, semesterStart, weeks, toDate) {
  const headers = [];
  for (const h of text.matchAll(re(P.HEADER))) {
    const parts = [...h[1].matchAll(re(P.TIME_RANGE))];
    const slots = parts.map((m) => slot(+m[1], +m[2], +m[3], +m[4])).filter(Boolean);
    if (slots.length && slots.length === parts.length) headers.push({ index: h.index, end: h.index + h[0].length, slots });
  }
  const out = [];
  headers.forEach((h, i) => {
    const bodyEnd = i + 1 < headers.length ? headers[i + 1].index : text.length;
    out.push(...parseSegment(text.slice(h.end, bodyEnd).trim(), h.slots, dw, groups, semesterStart, weeks, toDate));
  });
  return out;
}

function makeLesson(o) {
  return Object.assign({ online: false, specialTime: false, elective: null, stream: null, editId: null, location: null, details: '' }, o);
}

function extractDates(text, dw, semesterStart, weeks, toDate, fallback = true) {
  let rest = text;
  const online = new Set([...rest.matchAll(re(P.ONLINE))].map((m) => toDate(m[1])).filter((x) => x != null));
  rest = rest.replace(re(P.ONLINE), (_, d) => d + ' ');
  const overrides = new Map();
  rest = rest.replace(re(P.TRIPLE), (m0, x, y, z) => {
    const dx = toDate(x), dz = toDate(z);
    const asDT = dx != null && timeSlot(y, z) ? [dx, timeSlot(y, z)] : null;
    const asTD = dz != null && timeSlot(x, y) ? [dz, timeSlot(x, y)] : null;
    const pick = isDateLike(x) ? (asDT || asTD) : (asTD || asDT);
    if (pick) { overrides.set(pick[0], [pick[1]]); return ' ; '; }
    return m0;
  });
  const pm = P.PARITY.exec(rest);
  const parity = pm ? +pm[1] : null;
  const dates = new Set();
  const addRange = (a, b) => {
    let d = a;
    while (dow(d) !== dw) d++;
    for (; d <= b; d += 7) if (parity == null || weekType(weeks, d) === parity) dates.add(d);
  };
  rest = rest.replace(re(P.UNTIL), (m0, x) => { const b = toDate(x); if (b == null) return m0; addRange(semesterStart, b); return ' ; '; });
  rest = rest.replace(re(P.PAIR), (m0, x, y) => {
    const a = toDate(x), b = toDate(y);
    if (a != null && b != null && isDateLike(x) && isDateLike(y)) { addRange(a, b < a ? b + 365 : b); return ' ; '; }
    if (timeSlot(x, y)) return ' ; ';
    return m0;
  });
  for (const m of rest.matchAll(re(P.SINGLE))) if (isDateLike(m[1])) { const d = toDate(m[1]); if (d != null) dates.add(d); }
  for (const k of overrides.keys()) dates.add(k);
  if (!dates.size && fallback) addRange(semesterStart, semesterStart + 122);
  return { dates: [...dates].sort((a, b) => a - b), overrides, online };
}

function parseSegment(bodyRaw, slots, dw, groups, semesterStart, weeks, toDate) {
  let body = bodyRaw, kind = 'PRACTICE';
  if (body.toUpperCase().startsWith('ЛЕКЦИЯ')) { kind = 'LECTURE'; body = body.slice(6).trim(); }
  const up = body.toUpperCase();
  if ((up.startsWith('ДИСЦИПЛИНА ПО ВЫБОРУ') || up.startsWith('ЭЛЕКТИВН')) && kind !== 'LECTURE') kind = 'ELECTIVE';
  const i1 = body.search(re(P.SINGLE)), i2 = body.search(P.PARITY);
  const idx = [i1, i2].filter((x) => x >= 0);
  const firstDate = idx.length ? Math.min(...idx) : body.length;
  const fullSubject = sentence(body.slice(0, firstDate).trim().replace(/[,;\-]+$/, '').trim());
  const subject = shortName(fullSubject);
  const rest = body.slice(firstDate);
  const details = rest.trim();
  const spec = extractDates(rest, dw, semesterStart, weeks, toDate);
  const location = locationOf(details);
  if (/^дисциплина по выбору/i.test(subject)) {
    const opts = parseElectiveOptions(rest, slots, kind, dw, groups, semesterStart, weeks, toDate, details);
    if (opts.length) return opts;
  }
  return spec.dates.map((d) => {
    const own = spec.overrides.get(d);
    return makeLesson({ date: d, slots: own || slots, subject, fullSubject, kind, groups, location, details, online: spec.online.has(d), specialTime: !!own });
  });
}

function parseElectiveOptions(rest, slots, kind, dw, groups, semesterStart, weeks, toDate, details) {
  const options = [];
  let shared = '';
  for (const chunk of rest.split(';')) {
    const names = [];
    for (const m of chunk.matchAll(re(P.OPTION_NAME))) {
      const name = m[0].replace(P.OPTION_TAIL, '').trim().replace(/[, ]+$/, '');
      const first = name.split(' ')[0];
      if (name.length < 9 || first.length < 4 || first.startsWith('Дисциплин')) continue;
      names.push({ name, start: m.index, end: m.index + m[0].length });
    }
    if (!names.length) { shared += chunk + ' ; '; continue; }
    shared += chunk.slice(0, names[0].start) + ' ; ';
    names.forEach((n, i) => options.push({ name: n.name, own: chunk.slice(n.end, i + 1 < names.length ? names[i + 1].start : chunk.length), chunk }));
  }
  if (!options.length) return [];
  const sharedSpec = extractDates(shared, dw, semesterStart, weeks, toDate);
  const kindOut = kind === 'LECTURE' ? 'LECTURE' : 'ELECTIVE';
  const out = [], seen = new Set();
  for (const o of options) {
    if (seen.has(o.name)) continue; seen.add(o.name);
    const ownSpec = extractDates(o.own, dw, semesterStart, weeks, toDate, false);
    const spec = ownSpec.dates.length ? ownSpec : sharedSpec;
    let ownTime = null;
    for (const m of o.chunk.replace(re(P.TRIPLE), ' ').matchAll(re(P.PAIR))) {
      if (isDateLike(m[1]) && isDateLike(m[2])) continue;
      const t = timeSlot(m[1], m[2]); if (t) { ownTime = t; break; }
    }
    const baseSlots = ownTime ? [ownTime] : slots;
    const location = locationOf(o.chunk.replace(/ссылка\s*\d-\d{3}/g, ''));
    for (const d of spec.dates) {
      const own = spec.overrides.get(d);
      out.push(makeLesson({ date: d, slots: own || baseSlots, subject: o.name, fullSubject: o.name, kind: kindOut, groups, location, details: 'Дисциплина по выбору. ' + details, online: spec.online.has(d), specialTime: !!own, elective: o.name }));
    }
  }
  return out;
}

function valueAt(sheet, r, c) { const m = sheet.mergeOf(r, c); return m ? sheet.text(m.r1, m.c1) : sheet.text(r, c); }

function parseDisciplines(sheet) {
  const header = sheet.ordered.find((c) => c.col === 1 && clean(c.text).toLowerCase() === 'дисциплина');
  if (!header) return [];
  const cols = {};
  for (let c = 1; c <= sheet.maxCol; c++) cols[c] = clean(sheet.text(header.row, c)).toLowerCase();
  const nameCols = Object.keys(cols).map(Number).filter((c) => cols[c] === 'дисциплина').sort((a, b) => a - b);
  const out = [];
  for (let row = header.row + 1; row <= sheet.maxRow; row++) {
    if (clean(sheet.text(row, 1)).startsWith('Начальник')) break;
    nameCols.forEach((nc, idx) => {
      const next = idx + 1 < nameCols.length ? nameCols[idx + 1] : sheet.maxCol + 1;
      const name = clean(valueAt(sheet, row, nc));
      if (name.length < 4) return;
      let dep = '', att = null;
      for (let c = nc + 1; c < next; c++) {
        const mc = sheet.mergeOf(row, c);
        if (mc && mc.c1 !== c && mc.c1 > nc) continue;
        const h = cols[c] || '';
        const v = clean(valueAt(sheet, row, c));
        if (!v) continue;
        if (h.includes('аттестац')) att = v;
        else if (h.includes('кафедр') || h.includes('баз')) dep = dep ? dep + '; ' + v : v;
      }
      if (dep || att) out.push({ name, department: dep, attestation: att });
    });
  }
  return out;
}

/* ======================= Формат 2: цикловое расписание ======================= */
const CY = {
  TIME: /(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/,
  DAY_NAMES: [['понедельник', 1], ['вторник', 2], ['сред', 3], ['четверг', 4], ['пятниц', 5], ['суббот', 6]],
};
function monthOf(word) {
  const w = word.toLowerCase();
  if (w.startsWith('мар')) return 3;
  const keys = ['янв', 'фев', 'мар', 'апр', 'ма', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const i = keys.findIndex((k) => w.startsWith(k));
  return i >= 0 ? i + 1 : null;
}
function slotOf(text) {
  const m = CY.TIME.exec(text || '');
  if (!m) return null;
  const s = +m[1] * 60 + +m[2], e = +m[3] * 60 + +m[4];
  return +m[1] >= 6 && +m[1] <= 22 && e > s ? [s, e] : null;
}
const tidyName = (s) => clean(s.replace(/\*/g, '')).replace(/([а-яё])-([а-яё])/g, '$1$2');

function isCycle(sheet) {
  const col = [];
  for (let r = 1; r <= sheet.maxRow; r++) col.push(clean(sheet.text(r, 1)).toLowerCase());
  return col.includes('число') && col.some((x) => x.startsWith('день недели'));
}

function parseCycle(sheet, today) {
  const vals = sheet.values().map(clean);
  const all = vals.join('\n');
  const [ty, tm] = edParts(today);
  const ym = /(\d{4})\s*\/\s*(\d{2,4})/.exec(all) || /(\d{4})\s*-\s*(\d{4})/.exec(all);
  const startYear = ym ? +ym[1] : (tm >= 8 ? ty : ty - 1);
  const rowOf = (label) => { for (let r = 1; r <= sheet.maxRow; r++) if (clean(sheet.text(r, 1)).toLowerCase().startsWith(label)) return r; throw new Error('Нет строки «' + label + '»'); };
  const monthRow = rowOf('месяц'), dayRow = rowOf('число'), dowRow = rowOf('день недели');
  const dates = new Map();
  let month = null;
  for (let col = 2; col <= sheet.maxCol; col++) {
    const mo = monthOf(clean(valueAt(sheet, monthRow, col))); if (mo) month = mo;
    const dd = parseInt(clean(sheet.text(dayRow, col)).split('.')[0], 10);
    if (isNaN(dd) || !month) continue;
    const y = month >= 8 ? startYear : startYear + 1;
    if (edValid(y, month, dd)) dates.set(col, ed(y, month, dd));
  }
  if (!dates.size) throw new Error('Не удалось прочитать даты в шапке расписания');
  const dateCols = [...dates.keys()].sort((a, b) => a - b);
  const groupRows = new Map();
  for (let row = dowRow + 1; row <= sheet.maxRow; row++) {
    const g = clean(sheet.text(row, 2)).split('.')[0];
    if (/^\d{3,4}$/.test(g)) groupRows.set(row, g);
    else if (groupRows.size && g) break;
  }
  if (!groupRows.size) throw new Error('Не найдены строки групп');
  const groups = [...groupRows.values()];
  const discs = parseCycleTable(sheet);
  const place = (d) => [d.base, d.address].filter(Boolean).join(', ');
  const discFor = (cycle) => {
    const key = normKey(cycle);
    const practical = discs.filter((d) => !/лекци/i.test(d.name));
    const bySection = practical.find((d) => { const m = /раздел\s*["«]([^"»]+)["»]/i.exec(d.name); return m && normKey(m[1]) === key; });
    if (bySection) return bySection;
    const words = key.split(' ').slice(0, 2).join(' ');
    return practical.filter((d) => !/раздел\s*["«]/i.test(d.name)).find((d) => normKey(d.name).startsWith(words)) || null;
  };
  const fmt = (e) => { const [, m, d] = edParts(e); return `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}`; };
  const lessons = [];
  const studyDays = new Set(dates.values());
  let lastStudyDay = Math.min(...dates.values());

  for (const [row, group] of groupRows) {
    for (const col of dateCols) {
      const raw = sheet.text(row, col);
      if (!raw.trim()) continue;
      const merge = sheet.mergeOf(row, col);
      if (merge && (merge.r1 !== row || merge.c1 !== col)) continue;
      const c2 = merge ? merge.c2 : col, r2 = merge ? merge.r2 : row;
      const rowGroups = [...groupRows.entries()].filter(([r]) => r >= row && r <= r2).map(([, g]) => g);
      const text = clean(raw), low = text.toLowerCase();
      if (low.includes('каникул') || low.includes('экзамен')) continue;
      const cycleDates = dateCols.filter((c) => c >= col && c <= c2).map((c) => dates.get(c)).sort((a, b) => a - b);
      if (!cycleDates.length) continue;
      if (low.startsWith('зач')) {
        const at = slotOf(vals.find((v) => /^зач[её]т/i.test(v)) || '') || [510, 600];
        for (const d of cycleDates) lessons.push(makeLesson({ date: d, slots: [at], subject: tidyName(text), fullSubject: tidyName(text), kind: 'PRACTICE', groups: rowGroups, details: 'Зачёт' }));
        continue;
      }
      const star = text.includes('*');
      lastStudyDay = Math.max(lastStudyDay, cycleDates[cycleDates.length - 1]);
      const name = tidyName(text);
      const disc = discFor(name);
      let groupSpecific = null;
      if (disc && disc.shift2) { const gm = /гр\.?\s*(\d{3,4})/.exec(disc.shift2); if (gm && gm[1] === group) groupSpecific = slotOf(disc.shift2); }
      const slot1 = groupSpecific || (disc && slotOf(disc.shift1)) || [510, 745];
      const slot2 = disc && disc.shift2 && !/гр\.?\s*\d/.test(disc.shift2) ? slotOf(disc.shift2) : null;
      let details = `Цикл: ${fmt(cycleDates[0])}–${fmt(cycleDates[cycleDates.length - 1])} (${cycleDates.length} дн.)`;
      if (star) details += '. В первый день цикла — во вторую смену';
      if (disc && disc.department) details += '. Кафедра: ' + disc.department;
      const full = disc && tidyName(disc.name).length > name.length ? tidyName(disc.name) : name;
      cycleDates.forEach((d, i) => {
        const second = star && i === 0 && !groupSpecific && !!slot2;
        lessons.push(makeLesson({ date: d, slots: [second ? slot2 : slot1], subject: name, fullSubject: full, kind: 'PRACTICE', groups: rowGroups.length ? rowGroups : [group], location: disc ? place(disc) || null : null, details, specialTime: second }));
      });
    }
  }

  for (const d of discs) {
    const isLecture = /лекци/i.test(d.name), isSport = /физическ/i.test(d.name);
    if (!isLecture && !isSport) continue;
    for (const cell of [d.shift1, d.shift2]) {
      const sm = /(\d)\s*поток/.exec(cell); if (!sm) continue;
      const stream = +sm[1];
      const dn = CY.DAY_NAMES.find(([k]) => cell.toLowerCase().includes(k)); if (!dn) continue;
      const sl = slotOf(cell.replace(/с\s*\d{1,2}\.\d{2}\s*-\s*\d{1,2}\.\d{2}/g, '')); if (!sl) continue;
      const rm = /с\s*(\d{1,2})\.(\d{2})\s*-\s*(\d{1,2})\.(\d{2})/.exec(cell);
      const dateOf = (dd, mm) => ed(+mm >= 8 ? startYear : startYear + 1, +mm, +dd);
      const from = rm ? dateOf(rm[1], rm[2]) : Math.min(...dates.values());
      const to = Math.min(rm ? dateOf(rm[3], rm[4]) : lastStudyDay, lastStudyDay);
      const room = /(?<![\d.])(\d)-(\d{3})(?!\d)/.exec(cell);
      const subject = tidyName(d.name.replace(/\s*лекции/gi, ''));
      let day = from;
      while (dow(day) !== dn[1]) day++;
      for (; day <= to; day += 7) {
        if (!studyDays.has(day)) continue;
        const loc = [room ? `${room[1]} корпус, ауд. ${room[2]}` : null, d.address || null].filter(Boolean).join(', ') || place(d) || null;
        lessons.push(makeLesson({ date: day, slots: [sl], subject: shortName(subject), fullSubject: subject, kind: isLecture ? 'LECTURE' : 'ELECTIVE', groups: groups.slice(), stream, location: loc, details: `${stream} поток` }));
      }
    }
  }

  const prac = vals.find((v) => /учебная практика/i.test(v) && /\d/.test(v));
  if (prac) lessons.push(...parsePractice(prac, startYear, groups));

  const title = sentence(['РАСПИСАНИЕ', 'ДЛЯ'].map((p) => vals.find((v) => v.toUpperCase().startsWith(p))).filter(Boolean).join(' ').replace(/\s+/g, ' ')) || 'Расписание';
  let semStart = Math.min(...dates.values());
  const ss = /начало[^\d]{0,40}(\d{1,2})\s+([а-яё]+)\s+(\d{4})/i.exec(all);
  if (ss) { const mo = monthOf(ss[2]); if (mo && edValid(+ss[3], mo, +ss[1])) semStart = ed(+ss[3], mo, +ss[1]); }
  const seen = new Set();
  const uniq = lessons.filter((l) => { const k = lessonKey(l) + l.groups.slice().sort().join(','); if (seen.has(k)) return false; seen.add(k); return true; });
  return {
    title, groups, lessons: uniq, semesterStart: semStart, week1: [], week2: [],
    disciplines: discs.filter((d) => !/лекци/i.test(d.name)).map((d) => ({ name: tidyName(d.name), department: [d.department, place(d)].filter(Boolean).join(' · '), attestation: d.attestation })),
    electives: [], hasWeekParity: false,
    streams: [...new Set(uniq.map((l) => l.stream).filter(Boolean))].sort(),
  };
}

function parseCycleTable(sheet) {
  const header = sheet.ordered.find((c) => clean(c.text).toLowerCase() === 'дисциплина');
  if (!header) return [];
  const hr = header.row;
  const colWith = (w) => { for (let c = 1; c <= sheet.maxCol; c++) if (clean(sheet.text(hr, c)).toLowerCase().includes(w)) return c; return null; };
  const cAtt = colWith('аттестац'), cDep = colWith('кафедр'), cBase = colWith('баз'), cAddr = colWith('адрес'), cTime = colWith('время');
  let cS1 = null, cS2 = null;
  for (let c = 1; c <= sheet.maxCol; c++) { const t = clean(sheet.text(hr + 1, c)).toLowerCase(); if (t.startsWith('1 смен')) cS1 = c; if (t.startsWith('2 смен')) cS2 = c; }
  cS1 = cS1 || cTime;
  const at = (row, c) => (c ? clean(valueAt(sheet, row, c)) : '');
  const out = [];
  for (let row = hr + 1; row <= sheet.maxRow; row++) {
    const name = clean(sheet.text(row, header.col));
    if (!name || name.toLowerCase().includes('смена')) continue;
    const mg = sheet.mergeOf(row, header.col); if (mg && mg.r1 !== row) continue;
    out.push({
      name, attestation: at(row, cAtt) || null, department: at(row, cDep), base: at(row, cBase), address: at(row, cAddr),
      shift1: cS1 ? sheet.text(row, cS1).replace(/\n/g, ' ') : '', shift2: cS2 ? sheet.text(row, cS2).replace(/\n/g, ' ') : '',
    });
    if (/^Лекции по дисциплинам/i.test(name)) break;
  }
  return out.filter((d) => d.department || d.shift1);
}

function parsePractice(text, startYear, groups) {
  const cut = text.search(/ [-–] /);
  const datesPart = cut >= 0 ? text.slice(0, cut) : text;
  const dates = [];
  let pending = [];
  for (const m of datesPart.matchAll(/(\d{1,2})|([А-Яа-яЁё]+)/g)) {
    if (m[1]) pending.push(+m[1]);
    else { const mo = monthOf(m[2]); if (mo) { const y = mo >= 8 ? startYear : startYear + 1; pending.forEach((d) => { if (edValid(y, mo, d)) dates.push(ed(y, mo, d)); }); pending = []; } }
  }
  const rest = text.slice(datesPart.length);
  const main = slotOf(rest);
  if (!main) return [];
  const over = new Map();
  for (const m of rest.matchAll(/(\d{1,2})\s+([а-яё]+)\s+(\d{1,2}[.:]\d{2}\s*-\s*\d{1,2}[.:]\d{2})/g)) {
    const mo = monthOf(m[2]); if (!mo) continue;
    const y = mo >= 8 ? startYear : startYear + 1;
    if (!edValid(y, mo, +m[1])) continue;
    const s = slotOf(m[3]); if (s) over.set(ed(y, mo, +m[1]), s);
  }
  const qm = /«([^»]+)»|"([^"]+)"/.exec(rest);
  const subject = qm ? (qm[1] || qm[2]).split('(')[0].trim() : 'Учебная практика';
  return [...new Set(dates)].map((d) => makeLesson({ date: d, slots: [over.get(d) || main], subject: 'Практика: ' + subject, fullSubject: `Учебная практика «${subject}»`, kind: 'ELECTIVE', groups: groups.slice(), details: clean(text), specialTime: over.has(d) }));
}

async function parseSchedule(buf, today = todayEd()) {
  const sheet = await readXlsx(buf);
  return isCycle(sheet) ? parseCycle(sheet, today) : parseWeekly(sheet, today);
}

/* ======================= Хранилище ======================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('kgmu.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kgmu.' + k, JSON.stringify(v)); } catch (e) { toast(tr('Не удалось сохранить: память браузера переполнена')); } },
  del(k) { try { localStorage.removeItem('kgmu.' + k); } catch (e) {} },
};
const b64 = {
  enc(buf) { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  dec(str) { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; },
};

function refreshLessons() {
  const sch = S.schedule;
  if (!sch || !S.group) { S.lessons = []; return; }
  const chosen = new Set(S.electives.filter((e) => sch.electives.includes(e)));
  const mine = S.edits.filter((e) => e.group === S.group);
  const replaced = new Set(mine.map((e) => e.origKey).filter(Boolean));
  const seen = new Set();
  S.lessons = sch.lessons.filter((l) => l.groups.includes(S.group))
    .filter((l) => !replaced.has(lessonKey(l)))
    .concat(mine.filter((e) => e.lesson).map((e) => Object.assign({}, e.lesson, { editId: e.id })))
    .filter((l) => !l.elective || !chosen.size || chosen.has(l.elective))
    .filter((l) => !l.stream || !S.stream || l.stream === S.stream)
    .filter((l) => { const k = lessonKey(l); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => a.date - b.date || a.slots[0][0] - b.slots[0][0]);

}

function lessonState(l, now) {

}
function lessonCard(l, now) {

  const next = S.lessons.find((l) => startMs(l) > now);

function screenWeek(now) {
  const t = todayEd(), sel = S.weekSel, mon = mondayOf(sel), sch = S.schedule;
  const days = [0, 1, 2, 3, 4, 5, 6].map((i) => mon + i).filter((d) => dow(d) !== 7 || lessonsOn(d).length);
  const list = lessonsOn(sel);
  let h = `<div class="weekhead"><button class="iconbtn" style="box-shadow:none" data-act="week" data-d="-7">${icon('left')}</button>
    <div class="mid"><div style="font-size:17px;font-weight:800">${dayMonth(mon)} — ${dayMonth(mon + 6)}</div>
    ${sch.hasWeekParity ? `<div class="glowtxt" style="--a:var(--secondary);color:var(--secondary);font-size:13px;font-weight:700">${tr('{0} неделя', weekType(sch, mon))}</div>` : ''}</div>
    <button class="iconbtn" style="box-shadow:none" data-act="week" data-d="7">${icon('right')}</button></div>
    <div class="days">${days.map((d) => `<button class="day ${d === sel ? 'sel' : ''} ${d === t ? 'today' : ''}" data-act="day" data-d="${d}"><div class="w">${wdShort(d)}</div><div class="n">${edParts(d)[2]}</div><div class="dots">${'<i></i>'.repeat(Math.min(4, lessonsOn(d).length))}</div></button>`).join('')}</div>`;
  if (sel !== t) h += `<button class="btn grad todaybtn" data-act="day" data-d="${t}">↺&nbsp; ${tr('К сегодняшнему дню')}</button>`;
  h += `<div class="section" style="color:var(--primary)">${wdFull(sel)}, ${dayMonth(sel)}</div>`;
  h += list.length ? list.map((l) => lessonCard(l, now)).join('') : `<div class="card" style="--a:var(--success)"><div style="color:var(--success);font-size:18px;font-weight:800">${tr('Выходной ✨')}</div><div class="muted">${tr('В этот день занятий нет')}</div></div>`;
  h += `<button class="btn out" style="margin-top:4px" data-act="addLesson">${icon('add')} ${tr('Добавить занятие на {0}', `${wdShort(sel).toLowerCase()}, ${dayMonth(sel)}`)}</button>`;
  return h;
}

function hwRow(x, now, withMeta = true) {
  const due = msAt(x.dueDate, x.dueStart), left = due - now, t = todayEd();
  const footer = x.done ? `${relDay(x.dueDate, t)}, ${fmtMin(x.dueStart)}` : left < 0 ? tr('пара была {0}', relDay(x.dueDate, t).toLowerCase()) : `${relDay(x.dueDate, t)}, ${fmtMin(x.dueStart)} · ${tr('через {0}', humanize(left))}`;
  const urgent = !x.done && left >= 0 && left < 86400e3;
  return `<div class="card" style="--a:${x.done ? 'var(--success)' : 'var(--secondary)'};border-radius:18px"><div class="row" style="align-items:flex-start">
    <button class="check ${x.done ? 'on' : ''}" data-act="hwToggle" data-id="${x.id}" aria-label="${tr('Выполнено')}">${x.done ? icon('check', 'width:16px;height:16px') : ''}</button>
    <div class="grow" ${withMeta ? `data-act="hwOpen" data-id="${x.id}" style="cursor:pointer"` : ''}>
      ${withMeta ? `<div style="color:${x.done ? 'var(--success)' : 'var(--primary)'};font-size:12px;font-weight:800">${esc(x.subject)}</div>` : ''}
      <div style="font-size:15px;white-space:pre-wrap;${x.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(x.text)}</div>
      ${withMeta ? `<div style="font-size:12px;margin-top:2px;color:${urgent ? 'var(--secondary)' : 'var(--muted)'}">${footer}</div>` : ''}
    </div>
    <button data-act="hwDelete" data-id="${x.id}" aria-label="${tr('Удалить')}" style="color:var(--dim)">${icon('del')}</button></div></div>`;
}

function screenHw(now) {
  const all = groupHw().slice().sort((a, b) => a.dueDate - b.dueDate || a.dueStart - b.dueStart);
  const active = all.filter((x) => !x.done);
  const overdue = active.filter((x) => msAt(x.dueDate, x.dueStart) < now);
  const upcoming = active.filter((x) => !overdue.includes(x));
  const done = all.filter((x) => x.done).reverse();
  let h = `<h1 class="t glowtxt" style="--a:var(--secondary)">${tr('Домашние задания')}</h1>
    <div class="muted" style="font-size:13px;margin:2px 4px 0">${tr('Нажмите на пару в расписании или «+», чтобы добавить ДЗ к следующей паре')}</div>`;
  if (!all.length) h += `<div class="section"></div><div class="card" style="--a:var(--tertiary)"><div style="color:var(--tertiary);font-size:18px;font-weight:800">${tr('Пока пусто')}</div><div class="muted">${tr('Все задания будут здесь — с обратным отсчётом до пары')}</div></div>`;
  if (upcoming.length) h += `<div class="section" style="color:var(--primary)">${tr('Предстоящие · {0}', upcoming.length)}</div>` + upcoming.map((x) => hwRow(x, now)).join('');
  if (overdue.length) h += `<div class="section" style="color:var(--warning)">${tr('Пара уже прошла · {0}', overdue.length)}</div>` + overdue.map((x) => hwRow(x, now)).join('');
  if (done.length) h += `<div class="section" style="color:var(--success)">${tr('Выполнено · {0}', done.length)}</div>` + done.map((x) => hwRow(x, now)).join('');
  return h;
}

function screenGroup() {
  const planned = [['👥', 'Одногруппники', 'Список группы и контакты старосты', 'var(--primary)'], ['📝', 'Общие ДЗ', 'Задания, которые видит вся группа', 'var(--secondary)'],
    ['📣', 'Объявления', 'Переносы пар и новости от старосты', 'var(--tertiary)'], ['📊', 'Посещаемость', 'Отметки о пропусках и отработках', 'var(--success)']];
  return `<h1 class="t glowtxt">${tr('Моя группа')}</h1><div style="height:10px"></div>
    <div class="card glow"><div class="glowtxt" style="font-size:34px;font-weight:900;color:var(--primary)">${tr('Группа {0}', esc(S.group))}</div>
    <div class="muted" style="font-size:13px">${esc(S.schedule.title)}</div><div style="margin:10px 0 6px"><span class="chip fill" style="--a:var(--secondary)">${tr('скоро')}</span></div>
    <div style="font-size:14px">${tr('Раздел в разработке — здесь появятся функции для всей группы.')}</div></div>
    <div class="section">${tr('Что будет')}</div>` + planned.map(([e, t, d, c]) => `<div class="card" style="--a:${c}"><div class="row"><div style="font-size:26px">${e}</div><div class="grow"><div style="color:${c};font-weight:800">${tr(t)}</div><div class="muted" style="font-size:13px">${tr(d)}</div></div><div>🔒</div></div></div>`).join('');
}

/* ======================= Настройки ======================= */
function groupGrid(groups, sel, act) {
  return `<div class="grid4">${groups.map((g) => `<button class="tile ${g === sel ? 'sel' : ''}" data-act="${act}" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div>`;
}
function streamPicker(sel) {
  return `<div class="row">${S.schedule.streams.map((n) => `<button class="tile ${n === sel ? 'sel' : ''}" style="flex:1;aspect-ratio:auto;padding:16px 0;display:block" data-act="pickStream" data-v="${n}"><div style="font-size:28px;font-weight:900">${n}</div><div style="font-size:13px;font-weight:600;opacity:.8">${tr('поток')}</div></button>`).join('')}</div>`;
}
function screenSettings() {
  const sch = S.schedule;
  let h = `<div class="ohead"><div class="row" style="height:56px;margin-bottom:8px"><button class="iconbtn" data-act="closeSettings" aria-label="${tr('Назад')}">${icon('back')}</button>
    <div class="glowtxt" style="--a:var(--tertiary);font-size:26px;font-weight:800">${tr('Настройки')}</div></div>
    <div class="seg"><button class="${S.settingsTab === 0 ? 'on' : ''}" data-act="stab" data-v="0">${tr('Общие')}</button><button class="${S.settingsTab === 1 ? 'on' : ''}" data-act="stab" data-v="1">${tr('Профиль')} 🔒</button></div></div>`;
  if (S.settingsTab === 1) {
    return h + `<div style="height:12px"></div><div class="card glow" style="--a:var(--tertiary)"><div style="font-size:36px">🔒</div><div style="font-size:20px;font-weight:800;color:var(--tertiary);margin-top:6px">${tr('Профиль пока недоступен')}</div><div class="muted">${tr('Раздел появится в следующих обновлениях.')}</div></div>
      <div class="section">${tr('Что здесь будет')}</div>` + [['Имя и аватар', 'Ваш профиль студента'], ['Синхронизация', 'Перенос ДЗ и настроек на другое устройство'], ['Резервная копия', 'Сохранение и восстановление данных']].map(([a, b]) => `<div class="card" style="--a:var(--stroke)"><div class="muted" style="font-weight:700">${tr(a)}</div><div class="dim" style="font-size:13px">${tr(b)}</div></div>`).join('');
  }
  h += `<div class="section" style="color:var(--primary)">${tr('Тема оформления')}</div>
    <div class="seg" style="margin-bottom:12px">${MODES.map(([id, t]) => `<button class="${S.mode === id ? 'on' : ''}" data-act="mode" data-v="${id}">${tr(t)}</button>`).join('')}</div>
    <div class="grid4">${PALETTES.map((p) => { const sc = buildScheme(p, isDark()); const sel = p.id === S.theme;
      return `<button class="accent" data-act="theme" data-v="${p.id}" style="background:linear-gradient(180deg,${sc.surfaceHi},${sc.bg});border-color:${sel ? sc.primary : sc.stroke};${sel ? `border-width:2px;box-shadow:0 0 14px ${sc.primary}` : ''}">
        <div class="dot" style="background:conic-gradient(${sc.primary},${sc.tertiary},${sc.secondary},${sc.primary})"></div><span style="color:${sel ? sc.primary : sc.text}">${tr(p.name)}</span></button>`; }).join('')}</div>`;
  h += `<div class="section" style="color:var(--primary)">${tr('Номер группы')}</div>` + groupGrid(sch.groups, S.group, 'pickGroup');
  if (sch.streams.length) h += `<div class="section" style="color:var(--primary)">${tr('Поток')}</div>` + streamPicker(S.stream);
  h += `<div class="section" style="color:var(--primary)">${tr('Уведомления')}</div>` + notifCard();
  if (sch.electives.length) {
    h += `<div class="section" style="color:var(--success)">${tr('Дисциплины по выбору')}</div><div class="card" style="--a:var(--success)">
      <div class="muted" style="font-size:13px;margin-bottom:6px">${S.electives.length ? tr('В расписании только отмеченные дисциплины.') : tr('Отметьте свои — остальные исчезнут из расписания. Сейчас показаны все.')}</div>
      ${sch.electives.map((e) => { const on = S.electives.includes(e); return `<button class="row" style="width:100%;padding:6px 0;text-align:start" data-act="elective" data-v="${esc(e)}"><span class="check ${on ? 'on' : ''}" style="border-color:${on ? 'var(--success)' : 'var(--muted)'}">${on ? icon('check', 'width:16px;height:16px') : ''}</span><span class="grow" style="${on ? 'color:var(--success);font-weight:700' : ''}">${esc(e)}</span></button>`; }).join('')}
      ${S.electives.length ? `<button style="color:var(--primary);margin-top:8px" data-act="clearElectives">${tr('Показывать все')}</button>` : ''}</div>`;
  }
  const n = S.edits.filter((e) => e.group === S.group).length;
  h += `<div class="section" style="color:var(--warning)">${tr('Мои правки расписания')}</div><div class="card" style="--a:var(--warning)">
    <div style="font-size:14px">${n ? tr('Изменённых, добавленных и удалённых занятий: {0}', n) : tr('Правок нет. Чтобы изменить или удалить пару, нажмите на неё; добавить — во вкладке «Неделя».')}</div>
    ${n ? `<button class="btn out" style="--a:var(--warning);margin-top:10px;height:44px" data-act="resetEdits">${tr('Сбросить все правки')}</button>` : ''}</div>`;
  h += `<div class="section" style="color:var(--secondary)">${tr('Файл расписания')}</div><div class="card" style="--a:var(--secondary)">
    <div style="font-weight:650">${esc(sch.title)}</div>
    <div class="muted" style="font-size:13px">${tr('Начало семестра: {0} · занятий: {1}', `${dayMonth(sch.semesterStart)} ${edParts(sch.semesterStart)[0]}`, sch.lessons.length)}</div>
    <button class="btn" style="background:var(--secondary);margin-top:12px;height:46px" data-act="import">${tr('Загрузить новый .xlsx')}</button>
    <button class="btn out" style="--a:var(--muted);margin-top:8px;height:44px" data-act="removeSchedule">${tr('Удалить расписание')}</button>
    <div class="dim" style="font-size:12px;margin-top:8px">${tr('Файл и все данные хранятся только в этом браузере.')}</div></div>`;
  if (sch.disciplines.length) {
    const seen = new Set();
    h += `<div class="section" style="color:var(--tertiary)">${tr('Дисциплины и кафедры')}</div>` + sch.disciplines.filter((d) => !seen.has(d.name) && seen.add(d.name)).map((d) => `<div class="card" style="--a:var(--tertiary);border-radius:18px"><div style="font-weight:650">${esc(d.name)}</div>${d.department ? `<div class="muted" style="font-size:13px">${esc(d.department)}</div>` : ''}${d.attestation ? `<div style="color:var(--secondary);font-weight:800;font-size:13px">${esc(cap(d.attestation))}</div>` : ''}</div>`).join('');
  }
  return h;
}

function notifCard() {
  const n = S.notif, supported = 'Notification' in window, perm = supported ? Notification.permission : 'denied';
  const sw = (on, act) => `<button class="switch ${on ? 'on' : ''}" data-act="${act}" aria-label="${tr('переключить')}"></button>`;
  return `<div class="card">
    <div class="row" style="padding:4px 0"><span style="font-weight:800;color:${perm === 'granted' ? 'var(--success)' : 'var(--warning)'}">${perm === 'granted' ? '✓' : '!'}</span>
      <span class="grow" style="font-size:14px;${perm === 'granted' ? '' : 'color:var(--warning)'}">${tr(!supported ? 'Браузер не поддерживает уведомления' : perm === 'granted' ? 'Уведомления разрешены' : perm === 'denied' ? 'Уведомления запрещены в браузере' : 'Уведомления ещё не разрешены')}</span>
      ${supported && perm === 'default' ? '<button class="btn out" style="--a:var(--warning);width:auto;height:36px;padding:0 14px;font-size:13px" data-act="askNotif">' + tr('Разрешить') + '</button>' : ''}</div>
    <div class="row" style="padding:6px 0"><span class="grow">${tr('Перед началом пары')}</span>${sw(n.before, 'nBefore')}</div>
    ${n.before ? `<div class="hscroll">${[5, 10, 15, 30, 60].map((m) => `<button class="fchip ${n.lead === m ? 'on' : ''}" data-act="nLead" data-v="${m}">${m === 60 ? tr('за 1 час') : tr('за {0} мин', m)}</button>`).join('')}</div>` : ''}
    <div class="row" style="padding:6px 0"><span class="grow">${tr('Пары на завтра (вечером)')}</span>${sw(n.evening, 'nEvening')}</div>
    <div class="row" style="padding:6px 0"><span class="grow">${tr('Невыполненное ДЗ на завтра')}</span>${sw(n.homework, 'nHw')}</div>
    ${n.evening || n.homework ? `<div class="row" style="padding:6px 0"><span class="grow">${tr('Вечерние напоминания в')}</span><input type="time" class="field" style="width:120px;padding:8px 10px" value="${String(Math.floor(n.eveningAt / 60)).padStart(2, '0')}:${String(n.eveningAt % 60).padStart(2, '0')}" data-change="nEveningAt"></div>` : ''}
    <button class="btn out" style="--a:var(--secondary);margin-top:8px;height:44px" data-act="testNotif">${tr('Проверить уведомление')}</button>
    <div class="dim" style="font-size:12px;margin-top:8px">${tr('На сайте напоминания приходят, пока страница открыта (можно свернуть вкладку). Для напоминаний в фоне лучше Android-приложение.')}</div></div>`;
}

/* ======================= Модальные окна ======================= */
function findLesson(key) { return S.lessons.find((l) => lessonKey(l) === key); }
function nextOccurrence(l) {
  const later = S.lessons.filter((x) => x.subject === l.subject && startMs(x) > startMs(l));
  return later.find((x) => x.kind === l.kind) || later[0] || null;
}
function nextBySubject(subject) {
  const now = Date.now(), later = S.lessons.filter((x) => x.subject === subject && startMs(x) > now);
  return later.find((x) => x.kind !== 'LECTURE') || later[0] || null;
}
const subjects = () => [...new Set(S.lessons.map((l) => l.subject))].sort((a, b) => a.localeCompare(b, 'ru'));
function similarLessons(l) { return S.lessons.filter((x) => x.subject === l.subject && x.kind === l.kind && startOf(x) === startOf(l) && dow(x.date) === dow(l.date) && x.date >= l.date); }

function modalHtml(now) {
  const m = S.modal;
  if (!m) return '';
  if (m.type === 'lesson') {
    const l = findLesson(m.key);
    if (!l) { S.modal = null; return ''; }
    const k = KINDS[l.kind], next = nextOccurrence(l), d = disciplineInfo(l.subject), hw = hwFor(l);
    if (m.toNext == null) m.toNext = !!next;
    const info = (lab, v) => v ? `<div class="info-l">${lab}</div><div style="font-size:14px">${esc(v)}</div>` : '';
    return `<div class="scrim" data-act="close"><div class="sheet" data-stop><div class="grab"></div>
      <div class="chips"><span class="chip fill" style="--a:${k.c}">${tr(k.title)}</span>${l.online ? `<span class="chip" style="--a:var(--warning)">${tr('онлайн')}</span>` : ''}${l.specialTime ? `<span class="chip" style="--a:var(--warning)">${tr('другое время')}</span>` : ''}${l.editId ? `<span class="chip" style="--a:var(--warning)">${tr('изменено вручную')}</span>` : ''}</div>
      <div class="glowtxt" style="--a:${k.c};font-size:22px;font-weight:800;margin-top:10px">${esc(l.fullSubject)}</div>
      <div style="color:${k.c};font-weight:700;margin-top:6px">${wdShort(l.date)}, ${dayMonth(l.date)} · ${l.slots.map((s) => `${fmtMin(s[0])}–${fmtMin(s[1])}`).join('  ·  ')}</div>
      ${info(tr('Где'), l.location)}${info(tr('Кафедра / база'), d && d.department !== l.location ? d.department : '')}${info(tr('Аттестация'), d && d.attestation)}${info(tr('Из расписания'), l.details)}
      <div class="row" style="margin-top:16px"><button class="btn out" style="height:46px" data-act="editLesson">${icon('edit')} ${tr('Изменить')}</button><button class="btn out" style="--a:var(--secondary);height:46px" data-act="askDelete">${icon('del')} ${tr('Удалить')}</button></div>
      ${hw.length ? `<div class="section" style="color:var(--secondary)">${tr('ДЗ к этой паре')}</div>` + hw.map((x) => hwRow(x, now, false)).join('') : ''}
      <div class="section" style="color:var(--primary)">${tr('Добавить домашнее задание')}</div>
      <div class="hscroll">${next ? `<button class="fchip ${m.toNext ? 'on' : ''}" data-act="hwTarget" data-v="1">${tr('К след. паре: {0}', `${wdShort(next.date)}, ${dayMonth(next.date)}`)}</button>` : ''}<button class="fchip ${!m.toNext || !next ? 'on' : ''}" data-act="hwTarget" data-v="0">${tr('К этой паре')}</button></div>
      <textarea class="field" style="margin-top:8px" id="hwText" placeholder="${tr('Например: выучить тему 5, решить задачи 1–10')}">${esc(m.text || '')}</textarea>
      <button class="btn" style="margin-top:12px" data-act="saveHw">${icon('add')} ${tr('Сохранить ДЗ')}</button></div></div>`;
  }
  if (m.type === 'editor') {
    const e = m.form, orig = m.key ? findLesson(m.key) : null;
    const sim = orig ? similarLessons(orig).length : 0;
    const hhmm = (x) => `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`;
    return `<div class="scrim" data-act="close"><div class="sheet" data-stop><div class="grab"></div>
      <div class="glowtxt" style="font-size:22px;font-weight:800">${orig ? tr('Изменить занятие') : tr('Новое занятие')}</div>
      <div class="lbl">${tr('Предмет')}</div><input class="field" data-change="fSubject" value="${esc(e.subject)}" placeholder="${tr('Название предмета')}">
      <div class="hscroll" style="margin-top:6px">${subjects().map((s) => `<button class="fchip ${s === e.subject ? 'on' : ''}" data-act="fSubjectPick" data-v="${esc(s)}">${esc(s.length > 28 ? s.slice(0, 26) + '…' : s)}</button>`).join('')}</div>
      <div class="lbl">${tr('Тип занятия')}</div><div class="hscroll">${Object.entries(KINDS).map(([id, k]) => `<button class="fchip ${e.kind === id ? 'on' : ''}" style="--a:${k.c}" data-act="fKind" data-v="${id}">${tr(k.title)}</button>`).join('')}</div>
      <div class="lbl">${tr('Дата и время')}</div>
      <div class="row"><input type="date" class="field" style="flex:1.4" value="${iso(e.date)}" data-change="fDate"><input type="time" class="field" style="flex:1" value="${hhmm(e.start)}" data-change="fStart"><input type="time" class="field" style="flex:1" value="${hhmm(e.end)}" data-change="fEnd"></div>
      ${e.end <= e.start ? `<div style="color:var(--secondary);font-size:13px;margin-top:4px">${tr('Конец пары должен быть позже начала')}</div>` : ''}
      <div class="lbl">${tr('Где (корпус, аудитория)')}</div><input class="field" data-change="fLoc" value="${esc(e.location)}">
      <div class="lbl">${tr('Заметка')}</div><textarea class="field" data-change="fNote">${esc(e.note)}</textarea>
      ${!orig ? `<div class="row" style="margin-top:14px"><span class="grow">${tr('Повторять каждую неделю')}</span><button class="switch ${e.repeat ? 'on' : ''}" data-act="fRepeat"></button></div>
        ${e.repeat ? `<div class="row" style="margin-top:8px"><span class="grow muted">${tr('до')}</span><input type="date" class="field" style="width:60%" value="${iso(e.until)}" data-change="fUntil"></div>` : ''}`

      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-top:16px">

  }
  if (m.type === 'lang') {
    return `<div class="scrim" data-act="close"><div class="sheet" data-stop><div class="grab"></div>
      <div class="glowtxt" style="--a:var(--tertiary);font-size:22px;font-weight:800;margin-bottom:12px">${tr('Язык')}</div>

      <div style="max-height:60vh;overflow:auto">${subjects().map((s) => `<button style="display:block;width:100%;text-align:start;padding:10px 4px;font-size:15px" data-act="addhwSubject" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <div style="text-align:right;margin-top:8px"><button class="muted" data-act="close">${tr('Отмена')}</button></div></div></div>`;
    const target = nextBySubject(m.subject);
